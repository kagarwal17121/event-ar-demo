<script>
(async function(){
  const banner = document.getElementById('banner') || (()=>{
    const b=document.createElement('div'); b.id='banner'; b.style.cssText='background:#1b2333;border:1px solid #31405a;color:#d8dcee;padding:10px 12px;border-radius:10px;margin:12px 0';
    document.querySelector('.wrap').insertBefore(b, document.querySelector('.row'));
    return b;
  })();
  const grid = document.getElementById('grid') || (()=>{
    const g=document.createElement('div'); g.id='grid'; g.className='grid'; document.body.appendChild(g); return g;
  })();
  const countPill = document.getElementById('countPill');

  function msg(m){ banner.textContent = m; banner.hidden = false; }
  function ok(){ banner.hidden = true; }

  // Try both relative and absolute-to-repo paths (helps when served from /event-ar-demo/)
  const candidates = [
    './models/models.json',
    '/event-ar-demo/models/models.json'
  ];

  async function tryFetchJSON(url){
    const bust = `v=${Date.now()}`;
    const sep = url.includes('?') ? '&' : '?';
    const full = url + sep + bust;
    msg(`Fetching catalog: ${full}`);
    const res = await fetch(full, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} at ${full}`);
    const text = await res.text();
    try {
      return { data: JSON.parse(text), used: full };
    } catch(e){
      // show first 300 chars to catch BOM / HTML error pages
      throw new Error(`JSON parse failed at ${full}\nFirst 300 chars:\n${text.slice(0,300)}`);
    }
  }

  function normalizeCatalog(json){
    if (Array.isArray(json)) return json;
    if (json && typeof json === 'object' && json.categories){
      const out=[];
      for (const [cat, arr] of Object.entries(json.categories)){
        (arr||[]).forEach(it=> out.push({...it, category: it.category || cat}));
      }
      return out;
    }
    return [];
  }

  // Fetch with fallback
  let items=[], usedUrl='';
  let lastErr = null;
  for (const c of candidates){
    try{
      const r = await tryFetchJSON(c);
      items = normalizeCatalog(r.data);
      usedUrl = r.used;
      ok();
      break;
    }catch(e){
      lastErr = e;
    }
  }
  if (!usedUrl){
    msg(`Failed to load catalog from any known path.\n${lastErr?.message || lastErr}`);
    grid.innerHTML = '<div class="muted">No models.</div>';
    return;
  }

  if (!items.length){
    msg(`Loaded empty catalog from ${usedUrl}. Check file contents.`);
  } else {
    msg(`Loaded ${items.length} items from ${usedUrl}`);
    setTimeout(ok, 1200);
  }

  // Render cards, with per-item link checks
  const frag = document.createDocumentFragment();
  let okCount = 0;

  async function exists(url){
    try{
      const res = await fetch(url, { method:'HEAD' });
      if (res.ok) return true;
      // Some hosts disallow HEAD for blobs; fallback GET with minimal caching
      const g = await fetch(url, { method:'GET', cache:'no-store' });
      return g.ok;
    }catch{ return false; }
  }

  for (const [i,it] of items.entries()){
    const card = document.createElement('div');
    card.className = 'item';

    const img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    img.alt = it.name || it.url || `model-${i+1}`;
    img.src = it.thumbnail || './models/thumbs/placeholder.jpg';
    card.appendChild(img);

    const slug = document.createElement('div');
    slug.className = 'slug';
    slug.textContent = it.name || (it.url ? it.url.split('/').pop() : `Model ${i+1}`);
    card.appendChild(slug);

    const meta = document.createElement('div');
    meta.className = 'muted';
    meta.style.fontSize = '12px';
    meta.textContent = [it.category ? `Category: ${it.category}` : null, it.url ? `URL: ${it.url}` : null].filter(Boolean).join(' · ');
    card.appendChild(meta);

    const row = document.createElement('div');
    row.className = 'rowbtns';

    const view = document.createElement('a');
    view.href = '#';
    view.className = 'primary';
    view.textContent = 'Web View';
    view.addEventListener('click', (e)=>{ e.preventDefault(); loadModel(it.url, it.name || ''); });
    row.appendChild(view);

    const raw = document.createElement('a');
    raw.href = it.url;
    raw.target = '_blank';
    raw.rel = 'noopener';
    raw.textContent = 'Open .glb';
    row.appendChild(raw);

    // Validation badges
    const check = document.createElement('div');
    check.className = 'muted';
    check.style.fontSize = '12px';
    check.style.marginTop = '6px';
    check.textContent = 'checking links…';
    card.appendChild(check);

    // Asynchronously validate URLs; don’t block rendering
    (async()=>{
      const okModel = it.url ? await exists(it.url) : false;
      const okThumb = it.thumbnail ? await exists(it.thumbnail) : true; // thumb is optional
      if (okModel){ okCount++; }
      check.textContent = `model: ${okModel?'OK':'404'} · thumb: ${okThumb?'OK':'404'}`;
      if (!okModel) card.style.outline = '2px solid #ad2b2b';
      if (countPill){ countPill.textContent = `${okCount}/${items.length}`; countPill.hidden = false; }
    })();

    card.appendChild(row);
    frag.appendChild(card);
  }
  grid.innerHTML = '';
  grid.appendChild(frag);

  // Inline viewer / deep link
  function loadModel(path, slug){
    const mv = document.getElementById('mv');
    const openRaw = document.getElementById('openRaw');
    if (!path){ return; }
    mv.src = path;
    document.getElementById('viewerSlug').textContent = slug || path.split('/').pop();
    openRaw.href = path; openRaw.style.display = 'inline-block';
    const url = new URL(location.href);
    url.searchParams.set('m', path);
    url.searchParams.set('s', slug || '');
    history.replaceState({}, '', url);
  }
  window.loadModel = loadModel;

  const p = new URLSearchParams(location.search);
  const m = p.get('m'); const s = p.get('s');
  if (m) loadModel(m, s || '');
})();
</script>
