<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Manage Models</title>
<style>
  :root{--bg:#0b0b0f;--fg:#eaeaf1;--card:#12131a;--line:#232633;--brand:#2563ff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial}
  .wrap{max-width:1080px;margin:36px auto;padding:0 16px}
  h1{margin:0 0 12px}
  a.btn{display:inline-block;padding:12px 16px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none}
  .row{display:grid;grid-template-columns: 1fr 1fr; gap:16px}
  @media (max-width:900px){ .row{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#10121a}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid #1e2230;background:#161820}
  .slug{margin:8px 0 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowbtns{display:flex;gap:8px}
  .rowbtns a{flex:1;text-align:center;padding:8px 10px;border-radius:10px;text-decoration:none;border:1px solid #2a2f3a;color:var(--fg)}
  .rowbtns a.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .muted{opacity:.8}
  model-viewer{width:100%;height:520px;border-radius:12px;border:1px solid var(--line);background:#0f1118}
  .viewer-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .viewer-slug{font-weight:600}
  .hint{font-size:13px;opacity:.75}
  .status{margin:8px 0 0;font-size:13px;opacity:.8}
</style>

<!-- model-viewer web component -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<div class="wrap">
  <h1>Manage Models</h1>
  <p class="muted">Click “Web View” to preview a model inline. Use the button below to add new models.</p>

  <p>
    <a class="btn" href="https://github.com/kagarwal17121/event-ar-demo/issues/new?template=meshy_img2glb.yml" target="_blank" rel="noopener">
      ➕ Add New Model
    </a>
  </p>

  <div class="row">
    <!-- Gallery -->
    <div class="card">
      <h2>Models</h2>
      <!-- MODELS-START -->
      <div class="grid" id="grid"></div>
      <!-- MODELS-END -->
      <p class="hint">This list is built from <code>/models/models.json</code>.</p>
      <div id="status" class="status"></div>
    </div>

    <!-- Inline Viewer -->
    <div class="card">
      <div class="viewer-head">
        <div>
          <div class="muted" style="font-size:13px">Inline Web Viewer</div>
          <div class="viewer-slug" id="viewerSlug">Nothing loaded yet</div>
        </div>
        <a id="openRaw" class="btn" href="#" target="_blank" rel="noopener" style="display:none">Open .glb</a>
      </div>

      <model-viewer id="mv"
        src=""
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1.0"
        environment-image="neutral"
        auto-rotate>
      </model-viewer>
      <p class="hint" style="margin-top:8px">
        Supports pinch/zoom/rotate. AR works on supported devices.
      </p>
    </div>
  </div>
</div>

<script type="module">
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');

  const PLACEHOLDER =
    'data:image/svg+xml;charset=utf-8,' +
    encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
      <rect width="100%" height="100%" fill="#151824"/>
      <text x="50%" y="50%" fill="#67708a" font-size="32" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto">No thumbnail</text>
    </svg>`);

  function setStatus(msg){ statusEl.textContent = msg; }

  function fileNameFromUrl(u){
    try { return decodeURIComponent(u.split('/').pop()); } catch { return u; }
  }

  function ensureThumb(item){
    if (item.thumbnail) return item.thumbnail;
    // Try to derive: ./models/thumbs/<basename>.jpg
    try{
      const url = new URL(item.url, location.href);
      const base = url.pathname.split('/').pop().replace(/\.[^.]+$/,'');
      return `./models/thumbs/${base}.jpg`;
    }catch{ return PLACEHOLDER; }
  }

  function loadModel(path, slug) {
    const mv = document.getElementById('mv');
    mv.src = path;
    document.getElementById('viewerSlug').textContent = slug || fileNameFromUrl(path);
    const openRaw = document.getElementById('openRaw');
    openRaw.href = path;
    openRaw.style.display = 'inline-block';
    const url = new URL(location.href);
    url.searchParams.set('m', path);
    url.searchParams.set('s', slug || '');
    history.replaceState({}, '', url);
  }

  function render(items){
    if (!items.length){
      setStatus('No models found in catalog.');
      return;
    }
    setStatus(`Loaded ${items.length} item(s).`);
    grid.innerHTML = '';
    for (const it of items){
      const slug = it.name || fileNameFromUrl(it.url);
      const thumb = ensureThumb(it);

      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <img class="thumb" src="${thumb}" alt="" onerror="this.src='${PLACEHOLDER}'"/>
        <div class="slug" title="${slug}">${slug}</div>
        <div class="rowbtns">
          <a href="#" class="primary" data-model="${it.url}" data-slug="${slug}">Web View</a>
          <a href="${it.url}" target="_blank" rel="noopener">Raw GLB</a>
        </div>
        <div class="muted" style="margin-top:6px;font-size:12px">${it.category ? it.category : ''}</div>
      `;
      grid.appendChild(div);
    }
  }

  async function loadCatalog(){
    setStatus('Loading catalog…');
    try{
      // Bypass aggressive GH Pages caching
      const res = await fetch('./models/models.json?cb=' + Date.now(), { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();

      // Support both shapes
      let items = [];
      if (Array.isArray(json)){
        items = json;
      } else if (json && typeof json === 'object' && json.categories){
        for (const [cat, arr] of Object.entries(json.categories)){
          (arr || []).forEach(it => items.push({ ...it, category: it.category || cat }));
        }
      } else {
        throw new Error('Unexpected catalog format');
      }

      // Normalize URLs to be relative (so they work on GH Pages)
      items = items.map(it => ({
        ...it,
        url: it.url.startsWith('http') ? it.url : it.url.replace(/^\.?\//,'./') // ensure ./ relative
      }));

      render(items);

      // Auto-load from query
      const p = new URLSearchParams(location.search);
      const m = p.get('m');
      const s = p.get('s');
      if (m) loadModel(m, s || '');

    }catch(err){
      setStatus('Failed to load ./models/models.json — ' + (err.message || err));
      // Fallback: if GH Action injected static HTML between markers, it will still work.
    }
  }

  // Click -> Web View
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-model]');
    if (!a) return;
    e.preventDefault();
    loadModel(a.dataset.model, a.dataset.slug || '');
  });

  loadCatalog();
</script>
</html>
