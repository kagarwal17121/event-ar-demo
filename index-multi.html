<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Event AR — Queue + Mobile</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0b0f; font:15px system-ui,-apple-system,Segoe UI,Roboto; color:#eaeaf1; }

  /* Status strip */
  #status { position:fixed; inset:0 0 auto 0; height:28px; z-index:1000;
            padding:4px 10px; font:12px ui-monospace; color:#9aa0a6; background:#1a1c22; }

  /* Top HUD (collapsible on mobile if needed) */
  #hud { position:fixed; top:28px; left:0; right:0; z-index:900; padding:10px;
         background:rgba(10,10,12,.9); backdrop-filter:blur(6px); }
  #hud .row { display:flex; gap:8px; align-items:center; }
  #hud select, #hud button { height:44px; border-radius:12px; border:1px solid #2a2e36; background:#14161b; color:#fff; padding:0 12px; }
  #hud select { flex:1; min-width:160px; }
  #hud .primary { background:#2563ff; border-color:#2563ff; }
  #hud .ghost   { background:#191b22; }
  #queueChip { margin-left:auto; font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid #2a2e36; background:#12141a; }

  /* Bottom bar */
  #bottomBar { position:fixed; bottom:0; left:0; right:0; z-index:950; padding:8px;
               display:flex; gap:8px; background:rgba(10,10,12,.95); }
  #bottomBar button { flex:1; height:48px; border-radius:12px; border:none; font-weight:600; background:#2d2f36; color:#fff; }
  #enterAR { background:#2563ff; }

  /* Edit toolbar */
  #editHud { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); z-index:960;
             display:none; gap:8px; background:rgba(0,0,0,.7); padding:10px; border-radius:12px; }
  #editHud button { height:40px; border-radius:8px; border:none; padding:0 12px; background:#2a2f36; color:#fff; }

  /* Reticle + hint */
  #reticle { position:fixed; width:44px; height:44px; left:calc(50% - 22px); top:calc(50% - 22px);
             border:4px solid #1ea0ff; border-radius:50%; opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:800; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:130px; font-size:13px; color:#c9d1d9; opacity:.9; z-index:940; display:none; }

  /* Canvas */
  canvas { width:100vw; height:100vh; display:block; touch-action:none; }
</style>

<!-- Local import map for Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="status">boot…</div>

<!-- Top HUD -->
<div id="hud">
  <div class="row" style="margin-bottom:8px;">
    <select id="modelSel"><option>Loading…</option></select>
    <button id="btnQueue" class="primary">+ Queue</button>
    <button id="btnPlace" class="ghost">Place next</button>
    <span id="queueChip">Queue: 0</span>
  </div>
  <div class="row">
    <button id="btnShot" class="ghost">📸 Snapshot</button>
    <button id="btnRec"  class="ghost">⏺ Start</button>
  </div>
</div>

<!-- Reticle + hint -->
<div id="reticle"></div>
<div id="hint">Tap where the ring is to place</div>

<!-- Bottom bar -->
<div id="bottomBar">
  <button id="btnUndo">↺ Undo</button>
  <button id="btnClear">🗑 Clear</button>
  <button id="enterAR">📷 Enter AR</button>
</div>

<!-- Edit toolbar -->
<div id="editHud">
  <button id="rotL">◀</button>
  <button id="rotR">▶</button>
  <button id="sMinus">−</button>
  <button id="sPlus">＋</button>
  <button id="btnLock">🔒</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);

// UI refs
const statusEl = $('status');
const modelSel = $('modelSel');
const btnQueue = $('btnQueue');
const btnPlace = $('btnPlace');
const queueChip= $('queueChip');
const btnUndo  = $('btnUndo');
const btnClear = $('btnClear');
const enterBtn = $('enterAR');
const btnShot  = $('btnShot');
const btnRec   = $('btnRec');
const editHud  = $('editHud');
const rotL = $('rotL'), rotR = $('rotR'), sMinus=$('sMinus'), sPlus=$('sPlus'), btnLock=$('btnLock');
const reticleEl = $('reticle'), hintEl = $('hint');

const setStatus = t => { statusEl.textContent = t; };
const showReticle = v => { reticleEl.style.opacity = v?1:0; reticle3D.visible = !!v; };
const showHint = (t) => { hintEl.textContent = t; hintEl.style.display = 'block'; };
const hideHint = () => { hintEl.style.display = 'none'; };

// THREE setup
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.xr.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 40);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

const reticle3D = new THREE.Mesh(
  new THREE.RingGeometry(0.12,0.15,32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0x1ea0ff })
);
reticle3D.matrixAutoUpdate = false;
reticle3D.visible = false;
scene.add(reticle3D);

// Loaders
const draco = new DRACOLoader();
draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf = new GLTFLoader().setDRACOLoader(draco);

// State
let catalog = [];
const queue = [];         // holds model indices
const cache  = new Map(); // url -> THREE.Group (source scene)
const placed = [];        // placed objects (for undo/clear)
let active  = null;       // last placed (for editing)
let locked  = false;
let editing = false;

let xrSession=null, xrRefSpace=null, viewerSpace=null, hitTestSource=null;

// Helpers
function updateQueueChip(){ queueChip.textContent = `Queue: ${queue.length}`; }
function enableShadows(obj,on){ obj.traverse(n=>{ if(n.isMesh){ n.castShadow=on; n.receiveShadow=on; } }); }
async function preload(idx){
  const item=catalog[idx]; if(!item) throw new Error('invalid model index');
  if(cache.has(item.url)) return cache.get(item.url);
  const gl = await gltf.loadAsync(item.url);
  cache.set(item.url, gl.scene);
  return gl.scene;
}
function cloneFromCache(idx){
  const it=catalog[idx], src=cache.get(it.url), obj=src.clone(true);
  obj.scale.setScalar(it.scale ?? 1);
  if(it.rotation) obj.rotation.set(...it.rotation);
  enableShadows(obj, it.shadow !== false);
  return obj;
}
function enterEdit(obj){
  active=obj; editing=true; editHud.style.display='flex';
}
function exitEdit(){
  editing=false; active=null; editHud.style.display='none';
}

// Catalog
(async function loadCatalog(){
  try{
    const r=await fetch('./models/models.json',{cache:'no-cache'});
    catalog=await r.json();
    modelSel.innerHTML='';
    catalog.forEach((it,i)=>{
      const o=document.createElement('option');
      o.value=String(i); o.textContent=it.name||`Model ${i+1}`; modelSel.appendChild(o);
    });
    setStatus(`catalog loaded (${catalog.length})`);
  }catch(e){
    modelSel.innerHTML='<option>Failed to load</option>';
    setStatus('failed to load ./models/models.json');
  }
})();

// UI actions
btnQueue.onclick = async ()=>{
  const idx = Number(modelSel.value); if(Number.isNaN(idx)) return;
  try{
    await preload(idx);
    queue.push(idx);
    updateQueueChip();
    setStatus(`queued: ${catalog[idx].name}`);
    if (renderer.xr.isPresenting) showHint('Tap to place next queued model');
  }catch(e){ setStatus('preload error: '+e.message); }
};

btnPlace.onclick = async ()=>{
  // Put selected model at the front of the queue, so next tap places it
  const idx = Number(modelSel.value); if(Number.isNaN(idx)) return;
  try{
    await preload(idx);
    queue.unshift(idx);
    updateQueueChip();
    setStatus(`armed: ${catalog[idx].name} (tap to place)`);
    if (renderer.xr.isPresenting) showHint('Aim the ring and tap once to place');
  }catch(e){ setStatus('preload error: '+e.message); }
};

btnUndo.onclick = ()=>{
  const o = placed.pop();
  if (o){ scene.remove(o); if (o===active) exitEdit(); setStatus('undo'); }
};

btnClear.onclick = ()=>{
  while(placed.length){ const o=placed.pop(); scene.remove(o); }
  exitEdit(); setStatus('cleared');
};

// Edit toolbar
rotL.onclick   = ()=>{ if(active) active.rotation.y -= Math.PI/18; };
rotR.onclick   = ()=>{ if(active) active.rotation.y += Math.PI/18; };
sMinus.onclick = ()=>{ if(active){ const s=Math.max(0.05, active.scale.x*0.9); active.scale.setScalar(s); } };
sPlus.onclick  = ()=>{ if(active){ const s=Math.min(10,    active.scale.x*1.1); active.scale.setScalar(s); } };
btnLock.onclick= ()=>{ locked=!locked; btnLock.textContent=locked?'🔓':'🔒'; };

// Shots & recording
btnShot.onclick = ()=>{
  const url = renderer.domElement.toDataURL('image/png');
  const a=document.createElement('a'); a.href=url; a.download='ar-shot.png'; a.click();
};

let rec=null, chunks=[];
btnRec.onclick = ()=>{
  if (rec){ rec.stop(); rec=null; btnRec.textContent='⏺ Start'; return; }
  const stream = renderer.domElement.captureStream?.(30);
  if(!stream){ alert('Recording not supported on this browser'); return; }
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e=> e.data.size && chunks.push(e.data);
  rec.onstop = ()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ar-recording.webm'; a.click();
    chunks.length=0;
  };
  rec.start(); btnRec.textContent='⏹ Stop';
};

// AR session
enterBtn.onclick = async ()=>{
  if (xrSession){ xrSession.end(); return; }

  if (!navigator.xr){ alert('WebXR not available'); return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar');
  if(!ok){ alert('immersive-ar not supported'); return; }

  // IMPORTANT: keep UI visible in AR
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test', 'local-floor'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  });

  xrSession = session;
  renderer.xr.setSession(session);
  xrRefSpace   = await session.requestReferenceSpace('local-floor');
  viewerSpace  = await session.requestReferenceSpace('viewer');
  hitTestSource= await session.requestHitTestSource({ space: viewerSpace });

  session.addEventListener('end', ()=>{
    xrSession=null; hitTestSource=null; xrRefSpace=null; viewerSpace=null;
    showReticle(false); hideHint(); exitEdit(); enterBtn.textContent='📷 Enter AR'; setStatus('AR ended');
  });

  session.addEventListener('select', ()=>{
    // Only place if we have something queued and we’re not locked
    if (!queue.length || !reticle3D.visible || locked) return;
    const idx = queue.shift(); updateQueueChip();
    const obj = cloneFromCache(idx);
    obj.applyMatrix4(reticle3D.matrix);
    scene.add(obj); placed.push(obj);
    enterEdit(obj);
    setStatus(`placed: ${catalog[idx].name}`);
    if (!queue.length) hideHint();
  });

  enterBtn.textContent='⏻ Exit AR';
  setStatus('AR started — queue a model, then tap to place');
  if (queue.length) showHint('Tap to place next queued model'); else showHint('Tap “+ Queue” first');

  renderer.setAnimationLoop(onXRFrame);
};

function onXRFrame(t, frame){
  if (frame && hitTestSource && xrRefSpace){
    const hits = frame.getHitTestResults(hitTestSource);
    const canShow = (hits.length>0 && queue.length>0 && !editing);
    if (canShow){
      const pose = hits[0].getPose(xrRefSpace);
      reticle3D.matrix.fromArray(pose.transform.matrix);
      showReticle(true);
    } else {
      showReticle(false);
    }
  }
  renderer.render(scene, camera);
}

// Basic click toggles edit (last placed)
renderer.domElement.addEventListener('click', ()=>{
  if (!xrSession || !active) return;
  editing = !editing;
  editHud.style.display = editing ? 'flex' : 'none';
});

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// Boot
setStatus('loading catalog…');
updateQueueChip();
</script>
</body>
</html>
