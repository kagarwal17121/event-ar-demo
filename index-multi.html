<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Event AR — Queue + Categories</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0;background:#0b0b0f;color:#eaeaf1;font:15px system-ui,-apple-system,Segoe UI,Roboto}
  /* HUD */
  #hud{position:fixed;inset:0 auto auto 0;width:100%;box-sizing:border-box;padding:10px 12px;
       display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       background:rgba(10,10,12,.84);backdrop-filter:saturate(1.3) blur(6px);z-index:5}
  label{opacity:.85}
  select,button{height:44px;border-radius:12px;border:1px solid #2a2e36;background:#14161b;color:#fff;padding:0 12px}
  select{min-width:230px;max-width:62vw}
  button.primary{background:#2b6cff;border-color:#2b6cff}
  button.ghost{background:#191b22}
  button:disabled{opacity:.45}
  #right{margin-left:auto;display:flex;gap:8px}
  #enter{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;height:56px;border-radius:28px;padding:0 22px;z-index:4}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(0,0,0,.55);
        padding:8px 12px;border-radius:10px;font-size:13px;display:none;z-index:4}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>

<!-- Local import map -->
<script type="importmap">
{
  "imports":{
    "three":"./lib/three/build/three.module.js",
    "three/addons/":"./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- HUD (stays in AR via dom-overlay) -->
<div id="hud">
  <label for="modelSel">Model</label>
  <select id="modelSel"><option>Loading…</option></select>

  <button id="btnQueue" class="primary">+ Add</button>
  <button id="btnPlace" class="ghost">Place now</button>
  <button id="btnUndo"  class="ghost">↶ Undo</button>
  <button id="btnClear" class="ghost">🗑 Clear</button>

  <div id="right">
    <span id="qInfo" style="opacity:.8">Queue: 0</span>
    <button id="btnToggleUi" class="ghost">👁 Hide UI</button>
  </div>
</div>

<div id="hint">Tap to place next queued model</div>
<button id="enter" class="primary">📷 Enter AR</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const modelSel  = document.getElementById('modelSel');
const btnQueue  = document.getElementById('btnQueue');
const btnPlace  = document.getElementById('btnPlace');
const btnUndo   = document.getElementById('btnUndo');
const btnClear  = document.getElementById('btnClear');
const qInfo     = document.getElementById('qInfo');
const hintEl    = document.getElementById('hint');
const enterBtn  = document.getElementById('enter');
const hud       = document.getElementById('hud');
const btnToggle = document.getElementById('btnToggleUi');

let catalog = [];          // models.json
const cache  = new Map();  // URL -> GLTF.scene (cached)
const queue  = [];         // indices to place
const placed = [];         // THREE.Object3D placed in scene
let editing = false, selected = null;

// ---------- THREE setup ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 60);
camera.position.set(0,1.6,3);

scene.add(new THREE.HemisphereLight(0xffffff,0x444466,0.9));
const dir = new THREE.DirectionalLight(0xffffff,1.2); dir.position.set(3,5,2); dir.castShadow=true; scene.add(dir);

// Reticle
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.12,0.15,32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0x4da3ff })
);
reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

// Loaders
const draco = new DRACOLoader();
draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf = new GLTFLoader(); gltf.setDRACOLoader(draco);

// ---------- Catalog with categories ----------
async function loadCatalog() {
  try {
    const res = await fetch('./models/models.json', { cache:'no-store' });
    const data = await res.json();
    catalog = Array.isArray(data) ? data : (data.models || []);

    // Group by category (default “Other”), keep order inside groups
    const groups = new Map();
    catalog.forEach((item, i) => {
      const cat = (item.category || 'Other').trim();
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push({ i, name: item.name || `Model ${i+1}` });
    });

    const catNames = [...groups.keys()].sort((a,b)=>a.localeCompare(b));
    modelSel.innerHTML = '';
    for (const cat of catNames) {
      const og = document.createElement('optgroup');
      og.label = cat;
      for (const it of groups.get(cat)) {
        const opt = document.createElement('option');
        opt.value = String(it.i);
        opt.textContent = it.name;
        og.appendChild(opt);
      }
      modelSel.appendChild(og);
    }
  } catch (e) {
    console.error(e);
    modelSel.innerHTML = '<option>Failed to load catalog</option>';
  }
}
await loadCatalog();

// ---------- Helpers ----------
function updateQueueInfo(){
  qInfo.textContent = `Queue: ${queue.length}`;
  hintEl.style.display = (renderer.xr.isPresenting && !editing && queue.length>0) ? 'block' : 'none';
}
function enableShadows(obj,on){ obj.traverse(n=>{ if(n.isMesh){ n.castShadow=on; n.receiveShadow=on; }}); }
async function preload(idx){
  const item = catalog[idx]; if (!item) throw new Error('bad index');
  if (cache.has(item.url)) return cache.get(item.url);
  const gl = await gltf.loadAsync(item.url);
  cache.set(item.url, gl.scene);
  return gl.scene;
}
function cloneFromCache(idx){
  const it = catalog[idx];
  const src = cache.get(it.url);
  const obj = src.clone(true);
  const s = it.scale ?? 1; obj.scale.setScalar(s);
  if (it.rotation) obj.rotation.set(...it.rotation);
  if (it.position) obj.position.set(...it.position);
  enableShadows(obj, it.shadow !== false);
  return obj;
}

// ---------- UI actions ----------
btnQueue.onclick = async()=>{
  const idx = Number(modelSel.value); if (Number.isNaN(idx)) return;
  try { await preload(idx); queue.push(idx); updateQueueInfo(); }
  catch(e){ alert(`Couldn't load: ${catalog[idx]?.name||'model'}`); }
};
btnPlace.onclick = async()=>{
  const idx = Number(modelSel.value); if (Number.isNaN(idx)) return;
  try { await preload(idx); queue.unshift(idx); updateQueueInfo(); }
  catch(e){ alert(`Couldn't load: ${catalog[idx]?.name||'model'}`); }
};
btnUndo.onclick = ()=>{
  const last = placed.pop();
  if (last) last.parent?.remove(last);
};
btnClear.onclick = ()=>{
  while (placed.length) placed.pop().parent?.remove(placed[placed.length-1]);
  updateQueueInfo();
};
// Hide / show UI
let uiHidden=false;
btnToggle.onclick = ()=>{
  uiHidden = !uiHidden;
  hud.style.display = uiHidden ? 'none' : 'flex';
  btnToggle.textContent = uiHidden ? '👁 Show UI' : '👁 Hide UI';
};

// ---------- AR ----------
let xrRefSpace=null, hitTestSource=null;

enterBtn.onclick = async ()=>{
  if (!navigator.xr){ alert('WebXR not available'); return; }
  if (!await navigator.xr.isSessionSupported('immersive-ar')){ alert('immersive-ar not supported'); return; }

  renderer.xr.enabled = true;
  const session = await navigator.xr.requestSession('immersive-ar',{
    requiredFeatures:['hit-test','local-floor'],
    optionalFeatures:['dom-overlay'],
    domOverlay:{ root: document.body } // keep HUD visible and get touch events
  });
  renderer.xr.setSession(session);

  xrRefSpace = await session.requestReferenceSpace('local-floor');
  const viewer   = await session.requestReferenceSpace('viewer');
  hitTestSource  = await session.requestHitTestSource({ space: viewer });

  session.addEventListener('end', ()=>{
    hitTestSource=null; xrRefSpace=null; reticle.visible=false; editing=false; selected=null;
    hintEl.style.display='none';
  });

  // Tap to place from queue
  session.addEventListener('select', ()=>{
    if (editing || !queue.length || !reticle.visible) return;
    const idx = queue.shift();
    const obj = cloneFromCache(idx);
    const m = new THREE.Matrix4().copy(reticle.matrix);
    obj.position.setFromMatrixPosition(m);
    obj.quaternion.setFromRotationMatrix(m);
    scene.add(obj);
    placed.push(obj);
    editing=true; selected=obj; hintEl.style.display='none';
    updateQueueInfo();
  });

  // XR render loop (hit-test + render)
  renderer.setAnimationLoop((t, frame)=>{
    if (frame && hitTestSource && xrRefSpace){
      const hits = frame.getHitTestResults(hitTestSource);
      const canShow = (!editing && queue.length>0 && hits.length>0);
      if (canShow){
        const pose = hits[0].getPose(xrRefSpace);
        reticle.matrix.fromArray(pose.transform.matrix);
      }
      reticle.visible = canShow;
    }
    renderer.render(scene, camera);
  });

  updateQueueInfo();
};

// Basic gesture edit: pinch to scale, twist to rotate (when editing)
let g=null;
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const ang =(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const pt = t=>({x:t.clientX,y:t.clientY});

renderer.domElement.addEventListener('touchstart',(e)=>{
  if (!editing || !selected) return;
  if (e.touches.length===2){
    const p1=pt(e.touches[0]), p2=pt(e.touches[1]);
    g={ d:dist(p1,p2), a:ang(p1,p2), s:selected.scale.x, r:selected.rotation.y };
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove',(e)=>{
  if (!editing || !selected || !g || e.touches.length!==2) return;
  const p1=pt(e.touches[0]), p2=pt(e.touches[1]);
  // scale
  let s = g.s * (dist(p1,p2)/g.d); s = Math.min(Math.max(s,0.1),10); selected.scale.setScalar(s);
  // rotate
  const delta = ang(p1,p2)-g.a; selected.rotation.y = g.r + delta;
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>{ g=null; },{passive:true});

// Non-AR render loop (so you see something before entering AR)
(function loop(){ if(!renderer.xr.isPresenting) renderer.render(scene,camera); requestAnimationFrame(loop);} )();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>
</body>
</html>
