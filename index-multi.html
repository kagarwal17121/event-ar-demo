<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>The New Innings Planner — AR (Queue + Edit)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#0b0b0f; color:#e6e6eb; font:15px system-ui,-apple-system,Segoe UI,Roboto; }
  /* Canvas fills screen, UI floats; we don't need page scroll because the sheet itself scrolls */
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; z-index:0; }

  /* Top bar */
  #topbar {
    position:fixed; inset:0 0 auto 0; z-index:10;
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:linear-gradient(180deg,rgba(8,10,14,.92),rgba(8,10,14,.65) 60%, rgba(8,10,14,0) 100%);
    -webkit-backdrop-filter:saturate(1.4) blur(6px); backdrop-filter:saturate(1.4) blur(6px);
  }
  #brand { display:flex; align-items:center; gap:8px; font-weight:600; }
  #brand img { width:28px; height:28px; border-radius:6px; object-fit:cover; }
  #spacer { flex:1; }

  /* Bottom sheet (scrollable) */
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:rgba(12,14,18,.96);
    border-top:1px solid #2a2e36; border-radius:16px 16px 0 0;
    padding:12px; box-shadow:0 -10px 40px rgba(0,0,0,.35);
    max-height:44vh; overflow:auto; /* << mobile scroll fix */
    -webkit-overflow-scrolling:touch;
  }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .stack { display:grid; gap:8px; }
  select, button {
    height:42px; border-radius:12px; border:1px solid #2a2e36; background:#14161b; color:#fff; padding:0 12px;
  }
  select { min-width:210px; flex:1 1 210px; }
  button.primary { background:#2563ff; border-color:#2563ff; }
  button.ghost   { background:#191b22; }
  button.icon    { width:42px; padding:0; display:grid; place-items:center; }
  button:disabled { opacity:.45; }
  .chip { font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid #2a2e36; background:#12141a; }
  .on { border-color:#2f9e44; color:#b7ffbe; }

  /* Floating hint + reticle ring */
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:160px; color:#c9d1d9; font-size:13px;
          background:rgba(0,0,0,.55); padding:8px 12px; border-radius:10px; display:none; z-index:10; }
  #reticle { position:fixed; width:46px; height:46px; left:calc(50% - 23px); top:calc(50% - 23px);
             border:4px solid #1ea0ff; border-radius:50%; opacity:0; pointer-events:none; transition:opacity .18s; z-index:5; }

  /* Edit toolbar */
  #toolbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(44vh + 8px); z-index:10; display:none; gap:8px; }
  #toolbar > button { height:40px; border-radius:10px; }

  /* Show pills when UI hidden */
  #showUi  { position:fixed; left:12px; top:12px; z-index:11; display:none; height:42px; border-radius:20px; padding:0 12px; }
  #showCtl { position:fixed; right:12px; top:12px; z-index:11; display:none; height:42px; border-radius:20px; padding:0 12px; }

  /* Toast */
  #toast { position:fixed; left:50%; transform:translateX(-50%); top:12px; padding:6px 10px; border-radius:10px;
           background:rgba(0,0,0,.55); font:12px ui-monospace,Menlo,Consolas,monospace; z-index:11; display:none; }

  @media (max-width:480px){
    #brand span { display:none; }
  }
</style>

<!-- Import map -->
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>

<!-- Top bar -->
<div id="topbar">
  <div id="brand">
    <img src="./brand-logo.png" alt="Logo" onerror="this.style.display='none'"/>
    <span>The New Innings Planner</span>
  </div>

  <span id="queueChip" class="chip">Queue: 0</span>

  <div id="spacer"></div>

  <button id="btnRec" class="ghost">⏺ Record</button>
  <button id="btnHideCtl" class="ghost">🎛️ Hide Controls</button>
  <button id="btnHide" class="icon ghost" title="Hide UI">👁️</button>
</div>

<!-- Show UI/Controls pills -->
<button id="showUi"  class="ghost">👁️ Show UI</button>
<button id="showCtl" class="ghost">🎛️ Show Controls</button>

<!-- Scrollable bottom sheet (mobile fix) -->
<div id="sheet">
  <div class="stack">
    <div class="row">
      <label for="catSel">Category</label>
      <select id="catSel"><option>Loading…</option></select>
    </div>
    <div class="row">
      <label for="modelSel">Model</label>
      <select id="modelSel" disabled><option>Select category</option></select>
    </div>
    <div class="row">
      <button id="btnQueue" class="primary">+ Add to queue</button>
      <button id="btnPlace" class="ghost">Place now</button>
      <button id="btnUndo"  class="ghost">↺ Undo</button>
      <button id="btnClear" class="ghost">🗑 Clear</button>
      <button id="btnEnter" class="primary" style="margin-left:auto;">📷 Enter AR</button>
    </div>
    <div class="row" style="opacity:.8;">
      <span>Tip: Add multiple models to the queue, then tap to place each reticle hit.</span>
    </div>
  </div>
</div>

<!-- Edit toolbar -->
<div id="toolbar">
  <button id="rotL" class="ghost">◀ Rotate</button>
  <button id="rotR" class="ghost">Rotate ▶</button>
  <button id="sMinus" class="ghost">Scale −</button>
  <button id="sPlus"  class="ghost">Scale +</button>
  <button id="btnDone" class="primary">✅ Done</button>
</div>

<div id="hint">Tap to place next item in queue</div>
<div id="reticle"></div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $=id=>document.getElementById(id);

// UI
const btnEnter=$('btnEnter'), btnQueue=$('btnQueue'), btnPlace=$('btnPlace'), btnUndo=$('btnUndo'), btnClear=$('btnClear');
const catSel=$('catSel'), modelSel=$('modelSel'), queueChip=$('queueChip');
const hint=$('hint'), reticleEl=$('reticle'), toolbar=$('toolbar');
const rotL=$('rotL'), rotR=$('rotR'), sMinus=$('sMinus'), sPlus=$('sPlus'), btnDone=$('btnDone');
const btnHide=$('btnHide'), showUi=$('showUi'), btnHideCtl=$('btnHideCtl'), showCtl=$('showCtl');
const btnRec=$('btnRec'), toast=$('toast'), sheet=$('sheet'), topbar=$('topbar');

const log=(m,ms=1600)=>{ toast.textContent=m; toast.style.display='block'; clearTimeout(log._t); log._t=setTimeout(()=>toast.style.display='none',ms); };

// Three
const renderer = new THREE.WebGLRenderer({ canvas:$('c'), antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0,1.6,3);

const hemi = new THREE.HemisphereLight(0xffffff,0x444466,0.8); scene.add(hemi);
const dir  = new THREE.DirectionalLight(0xffffff,1.2); dir.position.set(3,5,2); dir.castShadow=true; scene.add(dir);

// Reticle (3D) for hit-test
const reticle3D = new THREE.Mesh(
  new THREE.RingGeometry(0.12,0.15,32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0x1ea0ff, side:THREE.DoubleSide })
);
reticle3D.matrixAutoUpdate=false; reticle3D.visible=false; scene.add(reticle3D);

// Loaders
const draco = new DRACOLoader(); draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf  = new GLTFLoader();  gltf.setDRACOLoader(draco);

// Catalog
const CATALOG_URL = './models/models.json?v=' + Date.now();
let catalog = { categories:{} };
let categories = [];

// Caches & state
const cache = new Map(); // url -> THREE.Object3D
const queue = [];        // numbers like {cat, idx}
const placed = [];
let selected=null, editing=false;
let gTwo=null;

function enableShadows(obj,on){ obj.traverse(n=>{ if(n.isMesh){ n.castShadow=on; n.receiveShadow=on; } }); }
async function preload(cat, idx){
  const it = catalog.categories[cat]?.[idx]; if(!it) throw new Error('Invalid item');
  if (cache.has(it.url)) return cache.get(it.url);
  const gl = await gltf.loadAsync(it.url);
  cache.set(it.url, gl.scene);
  return gl.scene;
}
function cloneFrom(cat, idx){
  const it = catalog.categories[cat][idx];
  const src = cache.get(it.url);
  const obj = src.clone(true);
  const s = it.scale ?? 1; obj.scale.setScalar(s);
  if (it.rotation) obj.rotation.set(...it.rotation);
  if (it.position) obj.position.set(...it.position);
  enableShadows(obj, it.shadow !== false);
  return obj;
}
function setEdit(on){
  editing=on;
  toolbar.style.display = on ? 'flex' : 'none';
  hint.style.display = (!on && renderer.xr.isPresenting && queue.length>0) ? 'block' : 'none';
}
function updateQueueChip(){ queueChip.textContent = `Queue: ${queue.length}`; }

// Hide/show UI
function toggleHUD(hide){
  topbar.style.display = hide ? 'none' : 'flex';
  sheet.style.display  = hide ? 'none' : 'block';
  toolbar.style.display = (hide ? 'none' : (editing ? 'flex' : 'none'));
  showUi.style.display = hide ? 'inline-block' : 'none';
}
btnHide.onclick = ()=> toggleHUD(true);
showUi.onclick  = ()=> toggleHUD(false);

// Hide/show controls (toolbar only)
btnHideCtl.onclick = ()=>{
  toolbar.style.display = 'none';
  showCtl.style.display = 'inline-block';
};
showCtl.onclick = ()=>{
  showCtl.style.display = 'none';
  if (editing) toolbar.style.display='flex';
};

// Catalog load
(async()=>{
  try{
    const r = await fetch(CATALOG_URL, { cache:'no-store' });
    let txt = await r.text();
    if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
    const data = JSON.parse(txt);
    catalog = Array.isArray(data) ? { categories:{ Default:data } } : data;
    categories = Object.keys(catalog.categories);
    catSel.innerHTML = '';
    for (const c of categories){
      const opt=document.createElement('option'); opt.value=c; opt.textContent=c; catSel.appendChild(opt);
    }
    refreshModels();
    log(`Catalog loaded (${categories.length} categories)`);
  }catch(e){
    catSel.innerHTML = '<option>Failed to load</option>';
    modelSel.innerHTML = '<option>—</option>';
    log('Failed to load catalog');
  }
})();
function refreshModels(){
  const cat = catSel.value;
  const arr = catalog.categories[cat] || [];
  modelSel.innerHTML='';
  arr.forEach((it,i)=>{
    const o=document.createElement('option'); o.value=String(i); o.textContent=it.name||`Model ${i+1}`; modelSel.appendChild(o);
  });
  modelSel.disabled = arr.length===0;
}
catSel.onchange = refreshModels;

// UI actions
btnQueue.onclick = async()=>{
  const cat=catSel.value; const idx=Number(modelSel.value);
  if (Number.isNaN(idx)) return;
  try{ await preload(cat, idx); queue.push({cat,idx}); updateQueueChip(); log('Queued'); }catch{ log('Preload failed'); }
};
btnPlace.onclick = async()=>{
  const cat=catSel.value; const idx=Number(modelSel.value);
  if (Number.isNaN(idx)) return;
  try{
    await preload(cat, idx);
    queue.unshift({cat,idx}); updateQueueChip(); log('Armed placement');
    // show hint in AR only
    if (renderer.xr.isPresenting && !editing) hint.style.display='block';
  }catch{ log('Preload failed'); }
};
btnUndo.onclick = ()=>{
  const last=placed.pop(); if(last){ last.parent?.remove(last); if (last===selected){ selected=null; setEdit(false);} }
};
btnClear.onclick = ()=>{
  while(placed.length){ const o=placed.pop(); o.parent?.remove(o); }
  selected=null; setEdit(false);
  log('Cleared');
};

// Edit toolbar
rotL.onclick = ()=>{ if(selected) selected.rotation.y -= Math.PI/18; };
rotR.onclick = ()=>{ if(selected) selected.rotation.y += Math.PI/18; };
sMinus.onclick= ()=>{ if(selected){ const s=Math.max(0.1, selected.scale.x*0.9); selected.scale.setScalar(s);} };
sPlus.onclick = ()=>{ if(selected){ const s=Math.min(10, selected.scale.x*1.1); selected.scale.setScalar(s);} };
btnDone.onclick = ()=>{ setEdit(false); selected=null; };

// AR session + hit test
let xrRefSpace=null, hitTestSource=null;
btnEnter.onclick = startAR;

async function startAR(){
  if (!navigator.xr){ alert('WebXR not available'); return; }
  if (!await navigator.xr.isSessionSupported('immersive-ar')){ alert('immersive-ar not supported'); return; }

  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures:['hit-test','local-floor'],
    optionalFeatures:['dom-overlay'],
    domOverlay:{ root: document.body }
  });
  renderer.xr.setSession(session);

  xrRefSpace = await session.requestReferenceSpace('local-floor');
  const viewer = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({ space: viewer });

  session.addEventListener('end', ()=>{
    hitTestSource=null; xrRefSpace=null;
    reticle3D.visible=false; reticleEl.style.opacity=0;
    setEdit(false); selected=null;
    log('AR ended');
  });

  // Place on select
  session.addEventListener('select', ()=>{
    if (editing || !queue.length || !reticle3D.visible) return;
    const {cat, idx} = queue.shift(); updateQueueChip();
    const obj = cloneFrom(cat, idx);
    obj.position.copy(reticle3D.position);
    obj.quaternion.copy(reticle3D.quaternion);
    scene.add(obj); placed.push(obj);
    selected=obj; setEdit(true);
    hint.style.display='none';
    log('Placed');
  });

  renderer.setAnimationLoop((t, frame)=>{
    if(frame && hitTestSource && xrRefSpace){
      const hits = frame.getHitTestResults(hitTestSource);
      const canShow = (!editing && queue.length>0 && hits.length>0);
      if (canShow){
        const pose = hits[0].getPose(xrRefSpace);
        reticle3D.matrix.fromArray(pose.transform.matrix);
        reticle3D.position.setFromMatrixPosition(reticle3D.matrix);
        reticle3D.quaternion.setFromRotationMatrix(reticle3D.matrix);
      }
      reticle3D.visible = canShow;
      reticleEl.style.opacity = canShow ? 1 : 0;
    }
    renderer.render(scene, camera);
  });

  // show hint if we have something queued
  hint.style.display = (queue.length>0) ? 'block' : 'none';
  log('AR started');
}

// Gestures for editing (pinch + twist)
function toPt(t){ return ({x:t.clientX,y:t.clientY}); }
function dist(a,b){ return Math.hypot(b.x-a.x,b.y-a.y); }
function a2(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }

renderer.domElement.addEventListener('touchstart',(e)=>{
  if(!editing || !selected) return;
  if(e.touches.length===2){
    const p1=toPt(e.touches[0]), p2=toPt(e.touches[1]);
    gTwo={ startDist: dist(p1,p2), startAng: a2(p1,p2), baseScale:selected.scale.x, baseRotY:selected.rotation.y };
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove',(e)=>{
  if(!editing || !selected || !gTwo || e.touches.length!==2) return;
  const p1=toPt(e.touches[0]), p2=toPt(e.touches[1]);
  // scale
  let s = gTwo.baseScale * (dist(p1,p2)/gTwo.startDist);
  s = Math.min(Math.max(s,0.1),10);
  selected.scale.setScalar(s);
  // rotate
  const delta = a2(p1,p2) - gTwo.startAng;
  selected.rotation.y = gTwo.baseRotY + delta;
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>{ if(editing) gTwo=null; },{passive:true});

// Layout / resize
function onResize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);
onResize();

// ---------- Recording ----------
let recorder=null, chunks=[], recording=false;
btnRec.onclick = ()=>{
  if (recording){
    recorder?.stop(); recording=false; btnRec.textContent='⏺ Record'; log('Recording saved soon…');
    return;
  }
  const stream = renderer.domElement.captureStream ? renderer.domElement.captureStream(30) : null;
  if (!stream){ alert('Recording not supported on this browser/device.'); return; }
  let mime='video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8';
  if (!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  chunks=[];
  recorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond:7_000_000 });
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{
    const blob = new Blob(chunks,{type:mime});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ar-recording-${Date.now()}.webm`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  recorder.start();
  recording=true; btnRec.textContent='⏹ Stop';
  log('Recording…');
};
</script>
</body>
</html>
