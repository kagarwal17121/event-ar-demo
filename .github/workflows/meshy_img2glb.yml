name: Meshy Pipeline

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  run-meshy:
    runs-on: ubuntu-latest
    if: contains(join(github.event.issue.labels.*.name), 'meshy_img2glb')

    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Parse issue fields
        id: parse
        run: |
          parse_section () {
            awk -v target="$1" '
              BEGIN{found=0}
              $0 ~ "^### " {
                if(found==1){exit}
                if($0 ~ "^### "target"$"){found=1; next}
              }
              found==1 {print}
            '
          }
          echo "${ISSUE_BODY}" > body.txt

          SLUG=$(parse_section "Model Slug" < body.txt | head -n1 | xargs)
          PROMPT=$(parse_section "Prompt" < body.txt | sed '/^$/q' | tr -d '\r')
          IMAGE=$(parse_section "Image URL" < body.txt | head -n1 | xargs)

          SAFE=$(echo "$SLUG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')

          echo "slug=$SAFE" >> $GITHUB_OUTPUT
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Call Meshy
        id: meshy
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set -e
          if [ -n "${{ steps.parse.outputs.image }}" ]; then
            URL="https://api.meshy.ai/v2/image-to-3d"
            JSON=$(jq -n --arg p "${{ steps.parse.outputs.prompt }}" --arg i "${{ steps.parse.outputs.image }}" \
              '{prompt:$p,image_url:$i,output_format:"glb"}')
          else
            URL="https://api.meshy.ai/v2/text-to-3d"
            JSON=$(jq -n --arg p "${{ steps.parse.outputs.prompt }}" \
              '{prompt:$p,output_format:"glb"}')
          fi

          RES=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $MESHY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")
          echo "$RES" > start.json

          TASK=$(jq -r '.task_id // .id // empty' start.json)
          if [ -z "$TASK" ] || [ "$TASK" = "null" ]; then
            echo "Could not get task id from Meshy:"
            cat start.json
            exit 1
          fi
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Wait for Meshy
        id: poll
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          TASK: ${{ steps.meshy.outputs.task }}
        run: |
          set -e
          for i in $(seq 1 300); do
            R=$(curl -sS -H "Authorization: Bearer $MESHY_API_KEY" "https://api.meshy.ai/v2/tasks/$TASK")
            STATUS=$(echo "$R" | jq -r '.status // empty')
            echo "Status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "completed" ]; then
              GLB=$(echo "$R" | jq -r '.result.glb_url // .output.glb // .assets.glb // empty')
              THUMB=$(echo "$R" | jq -r '.result.thumbnail_url // .output.thumbnail // .assets.thumbnail // empty')
              if [ -z "$GLB" ] || [ "$GLB" = "null" ]; then
                echo "No GLB URL in response:"
                echo "$R"
                exit 1
              fi
              echo "glb=$GLB" >> $GITHUB_OUTPUT
              echo "thumb=$THUMB" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "Meshy task failed:"
              echo "$R"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for Meshy"
          exit 1

      - name: Save files
        if: success()
        id: save
        run: |
          set -e
          slug="${{ steps.parse.outputs.slug }}"
          mkdir -p models/thumbs
          curl -L "${{ steps.poll.outputs.glb }}" -o "models/${slug}.glb"
          if [ -n "${{ steps.poll.outputs.thumb }}" ] && [ "${{ steps.poll.outputs.thumb }}" != "null" ]; then
            curl -L "${{ steps.poll.outputs.thumb }}" -o "models/thumbs/${slug}.jpg"
            echo "thumb_path=models/thumbs/${slug}.jpg" >> $GITHUB_OUTPUT
          else
            echo "thumb_path=" >> $GITHUB_OUTPUT
          fi
          echo "glb_path=models/${slug}.glb" >> $GITHUB_OUTPUT

      - name: Update models.json (safe, supports categories or flat)
        if: success()
        run: |
          set -e
          mkdir -p models

          slug="${{ steps.parse.outputs.slug }}"
          prompt="${{ steps.parse.outputs.prompt }}"
          glb_path="models/${slug}.glb"
          thumb_path="${{ steps.save.outputs.thumb_path }}"

          # Ensure a file exists (do NOT clobber existing content)
          if [ ! -f models/models.json ]; then
            echo "[]" > models/models.json
          fi

          # Backup once per run (best-effort)
          cp models/models.json models/models.json.bak || true

          # Normalize to flat array if file is in {"categories": {...}} format
          jq '
            if type=="array" then
              .
            elif (type=="object" and has("categories")) then
              ( .categories | to_entries | map(.value) | add )
            else
              []  # fallback
            end
          ' models/models.json > models/_normalized.json

          # Build new/updated entry
          if [ -n "$thumb_path" ]; then
            ENTRY=$(jq -n --arg s "$slug" --arg p "$prompt" --arg g "$glb_path" --arg t "$thumb_path" \
              '{id:$s,slug:$s,prompt:$p,glb:$g,thumb:$t}')
          else
            ENTRY=$(jq -n --arg s "$slug" --arg p "$prompt" --arg g "$glb_path" \
              '{id:$s,slug:$s,prompt:$p,glb:$g}')
          fi

          # Merge/replace by id or slug
          jq --argjson e "$ENTRY" '
            ( map(select((.id // .slug) != ($e.id // $e.slug))) + [$e] )
          ' models/_normalized.json > models/_merged.json

          mv models/_merged.json models/models.json
          rm -f models/_normalized.json

      - name: Update manage.html (inject cards)
        if: success()
        run: |
          set -e
          if [ ! -f manage.html ]; then
            echo "manage.html not found; skipping"
            exit 0
          fi

          CARDS="$(jq -r '
            # newest first if createdAt exists
            (if length > 0 and (.[0] | has("createdAt")) then sort_by(.createdAt) | reverse else . end)
            | map(
                (.thumb // "") as $t
                |
                "<div class=\"item\">"
                + ( if $t != "" then
                      "<img class=\"thumb\" src=\"" + $t + "\" alt=\"" + .slug + " thumbnail\"/>"
                    else "" end )
                + "<div class=\"slug\">" + .slug + "</div>"
                + "<div class=\"rowbtns\">"
                +   "<a class=\"primary\" href=\"#\" data-model=\"" + (.glb|gsub(\"^\\\\./\";\"\")) + "\" data-slug=\"" + .slug + "\">Web View</a>"
                + "</div>"
                + "</div>"
              )
            | join("\n")
          ' models/models.json 2>/dev/null || echo "")"

          HTML_BLOCK=$'<!-- MODELS-START -->\n<div class="grid">\n'"${CARDS}"$'\n</div>\n<!-- MODELS-END -->'

          awk -v repl="$HTML_BLOCK" '
            BEGIN { inblk=0 }
            /<!--[[:space:]]*MODELS-START[[:space:]]*-->/ { print repl; inblk=1; next }
            /<!--[[:space:]]*MODELS-END[[:space:]]*-->/ && inblk==1 { inblk=0; next }
            inblk==1 { next }
            { print }
          ' manage.html > manage.html.tmp && mv manage.html.tmp manage.html

      - name: Commit and Push
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/models.json models/*.glb models/thumbs/* || true
          git add manage.html
          git commit -m "Add/Update model ${{ steps.parse.outputs.slug }} via Meshy" || echo "No changes"
          git push
