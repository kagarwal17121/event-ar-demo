name: Rebuild Gallery from /models

on:
  workflow_dispatch: {}             # run manually from the Actions tab
  push:
    paths:
      - "models/**"                 # run when anything under models/ changes

permissions:
  contents: write

jobs:
  build:
    # prevent infinite loop when this workflow commits to the repo
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Build models/models.json from models/*.(glb|GLB)
        id: build_json
        run: |
          set -e
          mkdir -p models

          # find supports case-insensitive match (-iname)
          mapfile -t GLBS < <(find models -maxdepth 1 -type f \( -iname '*.glb' \) | sort)

          if [ ${#GLBS[@]} -eq 0 ]; then
            echo "No GLB files found under models/. Will NOT overwrite existing models/models.json."
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build array from discovered GLBs
          TMP="$(mktemp)"
          echo "[]" > "$TMP"
          for f in "${GLBS[@]}"; do
            slug="$(basename "$f")"
            slug="${slug%.*}"  # strip extension

            # thumbnail: prefer JPG, then PNG (case-insensitive)
            thumb=""
            if [ -f "models/thumbs/${slug}.jpg" ]; then
              thumb="models/thumbs/${slug}.jpg"
            elif [ -f "models/thumbs/${slug}.png" ]; then
              thumb="models/thumbs/${slug}.png"
            fi

            # one object for this model
            obj=$(jq -n --arg id "$slug" --arg slug "$slug" --arg glb "$f" --arg thumb "$thumb" '
              {id:$id, slug:$slug, glb:$glb} +
              ( ($thumb | select(. != "")) as $t | if $t then {thumb:$t} else {} end )
            ')
            jq --argjson o "$obj" '. + [$o]' "$TMP" > "${TMP}.2" && mv "${TMP}.2" "$TMP"
          done

          # sort by slug for stable order
          jq 'sort_by(.slug)' "$TMP" > models/models.json
          echo "Wrote models/models.json:"
          cat models/models.json
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Inject cards into manage.html (only if JSON updated)
        if: steps.build_json.outputs.updated == 'true'
        run: |
          set -e
          if [ ! -f manage.html ]; then
            echo "manage.html not found at repo root."
            exit 1
          fi

          # Build cards from models/models.json
          CARDS="$(jq -r '
            map(
              (.thumb // "") as $t
              |
              "<div class=\"item\">"
              + ( if $t != "" then
                    "<img class=\"thumb\" src=\"" + $t + "\" alt=\"" + .slug + " thumbnail\"/>"
                  else "" end )
              + "<div class=\"slug\">" + .slug + "</div>"
              + "<div class=\"rowbtns\">"
              +   "<a class=\"primary\" href=\"#\" data-model=\"" + (.glb|gsub(\"^\\\\./\";\"\")) + "\" data-slug=\"" + .slug + "\">Web View</a>"
              + "</div>"
              + "</div>"
            )
            | join("\n")
          ' models/models.json 2>/dev/null || echo "")"

          HTML_BLOCK=$'<!-- MODELS-START -->\n<div class="grid">\n'"${CARDS}"$'\n</div>\n<!-- MODELS-END -->'

          awk -v repl="$HTML_BLOCK" '
            BEGIN { inblk=0 }
            /<!--[[:space:]]*MODELS-START[[:space:]]*-->/ { print repl; inblk=1; next }
            /<!--[[:space:]]*MODELS-END[[:space:]]*-->/ && inblk==1 { inblk=0; next }
            inblk==1 { next }
            { print }
          ' manage.html > manage.html.tmp && mv manage.html.tmp manage.html

      - name: Commit & push (only if JSON updated)
        if: steps.build_json.outputs.updated == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/models.json manage.html
          git commit -m "[gallery] rebuild from /models (skip ci)" || { echo "No changes to commit"; exit 0; }
          git push
