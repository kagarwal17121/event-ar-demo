name: "Meshy: Image → GLB"
description: "Generate a 3D model with Meshy and update site automatically."
title: "Meshy: <short title here>"
labels: ["meshy_img2glb"]   # IMPORTANT: underscore, not dash
assignees: []

body:
  - type: input
    id: model-slug
    attributes:
      label: "Model Slug"
      description: "Unique identifier (used as filename)."
      placeholder: "e.g., red-chair-v2"
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: "Prompt"
      description: "Describe the object."
      placeholder: "A modern red wooden chair..."
    validations:
      required: true

  - type: input
    id: image-url
    attributes:
      label: "Image URL"
      description: "Optional. Provide a reference image."
      placeholder: "https://example.com/image.jpg"
