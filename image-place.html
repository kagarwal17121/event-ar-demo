<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Event Stager — Image Placement</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0b0f;font:15px system-ui,-apple-system,Segoe UI,Roboto;color:#e8eaf1}
  /* Background photo */
  #bgWrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  #bg{max-width:100vw;max-height:100vh;object-fit:contain}
  /* WebGL */
  canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}
  /* HUD */
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px;
       background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.22));z-index:5}
  select,button,input[type=file]{height:42px;border-radius:12px;border:1px solid #2a2e36;background:#151821;color:#fff;padding:0 12px}
  select{min-width:160px}
  button.primary{background:#2b6cff;border-color:#2b6cff}
  button.ghost{background:#11131a}
  #right{margin-left:auto;display:flex;gap:8px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.65);
         padding:10px 14px;border-radius:12px;font-size:13px;z-index:6;display:none}
  #hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(0,0,0,.55);
        padding:8px 12px;border-radius:12px;font-size:13px;z-index:6;display:none}
</style>

<!-- Import map (LOCAL paths, like index-multi.html) -->
<script type="importmap">
{
  "imports":{
    "three":"./lib/three/build/three.module.js",
    "three/addons/":"./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="bgWrap"><img id="bg" alt="Upload a photo to start"/></div>

<div id="hud">
  <label for="photo" style="opacity:.85">Photo</label>
  <input id="photo" type="file" accept="image/*" capture="environment"/>

  <label style="margin-left:6px;opacity:.85">Category</label>
  <select id="catSel"><option>Loading…</option></select>

  <label style="opacity:.85">Model</label>
  <select id="modelSel"><option>—</option></select>

  <button id="btnAdd" class="primary">+ Add</button>
  <button id="btnUndo" class="ghost">↺ Undo</button>
  <button id="btnClear" class="ghost">🗑 Clear</button>

  <div id="right">
    <button id="btnSave" class="ghost">💾 Save PNG</button>
    <button id="btnUi"   class="ghost">👁 Hide UI</button>
  </div>
</div>

<div id="hint">Drag = move · Pinch = scale · Twist = rotate</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);
const photo   = $('photo');
const bgImg   = $('bg');
const hud     = $('hud');
const toastEl = $('toast');
const hintEl  = $('hint');
const catSel  = $('catSel');
const modelSel= $('modelSel');
const btnAdd  = $('btnAdd');
const btnUndo = $('btnUndo');
const btnClear= $('btnClear');
const btnSave = $('btnSave');
const btnUi   = $('btnUi');

function toast(msg, ms=1800){ toastEl.textContent=msg; toastEl.style.display='block'; clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.style.display='none', ms); }
function showHint(on){ hintEl.style.display = on ? 'block' : 'none'; }

// --------- Three scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 3);

// Lighting & soft ground
scene.add(new THREE.HemisphereLight(0xffffff,0x444466,0.9));
const dir = new THREE.DirectionalLight(0xffffff,1.1); dir.position.set(2,4,2); dir.castShadow=true; scene.add(dir);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.ShadowMaterial({opacity:0.3}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// Loaders (LOCAL DRACO path!)
const draco = new DRACOLoader();
draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf = new GLTFLoader(); gltf.setDRACOLoader(draco);

// Catalog with categories
const CATALOG_URL = './models/models.json';
let catalog = [];          // flat list
let byCat   = new Map();   // category -> array
const cache = new Map();   // url -> THREE.Group
const placed= [];          // stack of added objects
let active  = null;        // last selected

async function loadCatalog() {
  try{
    const r = await fetch(CATALOG_URL, { cache:'no-store' });
    const data = await r.json();
    catalog = Array.isArray(data) ? data : (data.models || []);
    // bucket by category (fallback "General")
    byCat.clear();
    for (const it of catalog){
      const cat = (it.category || 'General').trim();
      if (!byCat.has(cat)) byCat.set(cat, []);
      byCat.get(cat).push(it);
    }
    // populate category select
    catSel.innerHTML = '';
    [...byCat.keys()].sort().forEach(c=>{
      const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o);
    });
    rebuildModelList();
    toast(`Catalog ready (${catalog.length})`);
  }catch(e){
    catSel.innerHTML = '<option>Failed</option>';
    modelSel.innerHTML = '<option>—</option>';
    toast('Failed to load models.json');
  }
}
function rebuildModelList(){
  const list = byCat.get(catSel.value) || [];
  modelSel.innerHTML = '';
  list.forEach((m,i)=>{ const o=document.createElement('option'); o.value=String(i); o.textContent=m.name||m.url; modelSel.appendChild(o); });
}
catSel.addEventListener('change', rebuildModelList);
await loadCatalog();

// Preload + clone helpers
async function ensureLoaded(item){
  if (cache.has(item.url)) return cache.get(item.url);
  const gl = await gltf.loadAsync(item.url);
  cache.set(item.url, gl.scene);
  return gl.scene;
}
function cloneFrom(item){
  const src = cache.get(item.url);
  const obj = src.clone(true);
  const s = item.scale ?? 1; obj.scale.setScalar(s);
  if (item.rotation) obj.rotation.set(...item.rotation);
  if (item.position) obj.position.set(...item.position);
  obj.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; }});
  return obj;
}

// ---------- Background photo ----------
photo.addEventListener('change', ()=>{
  const f = photo.files?.[0]; if(!f) return;
  const url = URL.createObjectURL(f);
  bgImg.src = url;
  bgImg.onload = ()=> URL.revokeObjectURL(url);
});

// ---------- Placement gestures ----------
let touch = {mode:'idle', p1:null, p2:null, startScale:1, startRotY:0};

function screenToGround(x,y){
  const ndc = new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc,camera);
  const hit = ray.intersectObject(ground, false)[0];
  return hit?.point || null;
}

renderer.domElement.addEventListener('touchstart', (e)=>{
  if (!active) return;
  if (e.touches.length===1){
    touch.mode='drag';
    touch.p1 = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    touch.anchor = screenToGround(touch.p1.x, touch.p1.y) || active.position.clone();
  } else if (e.touches.length===2){
    touch.mode='transform';
    touch.p1 = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    touch.p2 = {x:e.touches[1].clientX, y:e.touches[1].clientY};
    touch.startD = Math.hypot(touch.p2.x-touch.p1.x, touch.p2.y-touch.p1.y);
    touch.startA = Math.atan2(touch.p2.y-touch.p1.y, touch.p2.x-touch.p1.x);
    touch.startScale = active.scale.x;
    touch.startRotY  = active.rotation.y;
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove', (e)=>{
  if (!active) return;
  if (touch.mode==='drag' && e.touches.length===1){
    const pt = screenToGround(e.touches[0].clientX, e.touches[0].clientY);
    if (pt){ active.position.lerp(pt, 0.3); }
  } else if (touch.mode==='transform' && e.touches.length===2){
    const p1 = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    const p2 = {x:e.touches[1].clientX, y:e.touches[1].clientY};
    const d  = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    const a  = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    // scale
    let s = touch.startScale * (d / touch.startD);
    s = Math.min(Math.max(s, 0.05), 20);
    active.scale.setScalar(s);
    // rotate
    active.rotation.y = touch.startRotY + (a - touch.startA);
  }
},{passive:true});

renderer.domElement.addEventListener('touchend', ()=>{ touch.mode='idle'; },{passive:true});

// tap to make last placed active
renderer.domElement.addEventListener('click', ()=>{
  if (placed.length){ active = placed[placed.length-1]; showHint(true); }
});

// ---------- Buttons ----------
btnAdd.onclick = async ()=>{
  const list = byCat.get(catSel.value) || [];
  const item = list[ Number(modelSel.value) ];
  if (!item){ toast('Choose a model'); return; }
  try{
    toast('Loading model…');
    await ensureLoaded(item);
    const o = cloneFrom(item);
    o.position.set(0,0,0);
    scene.add(o);
    placed.push(o);
    active = o;
    showHint(true);
    toast('Model added');
  }catch(e){
    console.error(e);
    toast('Model load failed');
  }
};

btnUndo.onclick = ()=>{
  const o = placed.pop();
  if (o){ scene.remove(o); if (o===active) active=null; toast('Undone'); }
};

btnClear.onclick = ()=>{
  while(placed.length){ scene.remove(placed.pop()); }
  active=null; toast('Cleared');
};

btnUi.onclick = ()=>{
  const hidden = hud.style.display==='none';
  hud.style.display = hidden ? 'flex' : 'none';
  btnUi.textContent = hidden ? '👁 Hide UI' : '👁 Show UI';
};

btnSave.onclick = ()=>{
  // Composite BG photo + WebGL canvas into one PNG
  const w = bgImg.naturalWidth || innerWidth;
  const h = bgImg.naturalHeight || innerHeight;
  const out = document.createElement('canvas'); out.width=w; out.height=h;
  const ctx = out.getContext('2d');
  // draw bg (fit contain)
  const ratio = Math.min(w/(bgImg.width||w), h/(bgImg.height||h)); // fallback
  // Easier: draw natural image to full canvas
  if (bgImg.src) ctx.drawImage(bgImg, 0, 0, w, h);
  // draw 3D canvas scaled to the same size
  const glURL = renderer.domElement.toDataURL('image/png');
  const im = new Image(); im.onload = ()=>{
    ctx.drawImage(im, 0, 0, w, h);
    const a=document.createElement('a'); a.href=out.toDataURL('image/png'); a.download=`staged-${Date.now()}.png`; a.click();
  };
  im.src = glURL;
};

// ---------- Render loop & resize ----------
function tick(){ renderer.render(scene,camera); requestAnimationFrame(tick); }
tick();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>
</body>
</html>
