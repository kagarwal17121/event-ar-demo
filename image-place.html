<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Event Stager — Image Placement (Mobile)</title>
<style>
  :root{ color-scheme:dark }
  html,body{ margin:0; height:100%; background:#0b0b0f; font:15px system-ui,-apple-system,Segoe UI,Roboto; color:#e8eaf1; }

  /* Background photo */
  #bgWrap{ position:fixed; inset:0; display:grid; place-items:center; background:#000; }
  #bg{ max-width:100vw; max-height:100vh; object-fit:contain; }

  /* WebGL */
  canvas{ position:fixed; inset:0; display:block; width:100vw; height:100vh; touch-action:none; }

  /* Bottom control panel */
  #panel{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; flex-direction:column; gap:8px;
    padding:10px 12px 12px;
    background:linear-gradient(0deg,rgba(0,0,0,.86),rgba(0,0,0,.40));
    backdrop-filter:saturate(1.3) blur(6px);
  }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  /* Allow horizontal scroll if things don’t fit */
  .row.scroller{ overflow-x:auto; padding-bottom:2px; }
  .row.scroller::-webkit-scrollbar{ height:6px }
  .row.scroller::-webkit-scrollbar-thumb{ background:#2a2e36; border-radius:999px }

  select,button,input[type=file]{
    height:44px; border-radius:12px; border:1px solid #2a2e36; background:#151821; color:#fff; padding:0 12px;
  }
  select{ min-width:170px; }
  button.primary{ background:#2b6cff; border-color:#2b6cff; }
  button.ghost{ background:#11131a; }
  button.icon{ width:44px; padding:0 }
  button:active{ transform:translateY(1px) }

  #toast{
    position:fixed; left:50%; bottom:84px; transform:translateX(-50%);
    background:rgba(0,0,0,.65); padding:10px 14px; border-radius:12px; font-size:13px;
    z-index:6; display:none;
  }
  #hint{
    position:fixed; left:50%; bottom:140px; transform:translateX(-50%);
    background:rgba(0,0,0,.55); padding:8px 12px; border-radius:12px; font-size:13px; z-index:6; display:none;
  }

  /* Compact on very small screens */
  @media (max-width:380px){
    select{ min-width:140px }
    button{ height:40px }
  }
</style>

<!-- LOCAL import map (same as AR page) -->
<script type="importmap">
{
  "imports":{
    "three":"./lib/three/build/three.module.js",
    "three/addons/":"./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- Backdrop photo -->
<div id="bgWrap"><img id="bg" alt="Upload or take a photo to start"/></div>

<!-- Hidden inputs: separate for gallery vs camera -->
<input id="pickGallery" type="file" accept="image/*" hidden>
<input id="pickCamera"  type="file" accept="image/*" capture="environment" hidden>

<!-- Controls (bottom) -->
<div id="panel">
  <!-- Row 1: photo + quick actions -->
  <div class="row scroller">
    <button id="btnGallery" class="ghost">🖼️ Choose from Gallery</button>
    <button id="btnCamera"  class="ghost">📷 Take Photo</button>
    <div style="flex:1"></div>
    <button id="btnSave" class="ghost">💾 Save PNG</button>
    <button id="btnUi"   class="ghost icon" title="Hide/Show UI">👁</button>
  </div>

  <!-- Row 2: model selection -->
  <div class="row scroller">
    <label style="opacity:.85">Category</label>
    <select id="catSel"><option>Loading…</option></select>

    <label style="opacity:.85">Model</label>
    <select id="modelSel"><option>—</option></select>

    <button id="btnAdd"   class="primary">+ Add</button>
    <button id="btnUndo"  class="ghost">↺ Undo</button>
    <button id="btnClear" class="ghost">🗑 Clear</button>
  </div>
</div>

<div id="hint">Drag = move · Pinch = scale · Twist = rotate</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);

/* UI refs */
const bgImg       = $('bg');
const panel       = $('panel');
const toastEl     = $('toast');
const hintEl      = $('hint');
const catSel      = $('catSel');
const modelSel    = $('modelSel');
const btnAdd      = $('btnAdd');
const btnUndo     = $('btnUndo');
const btnClear    = $('btnClear');
const btnSave     = $('btnSave');
const btnUi       = $('btnUi');
const btnGallery  = $('btnGallery');
const btnCamera   = $('btnCamera');
const pickGallery = $('pickGallery');
const pickCamera  = $('pickCamera');

/* Toast + hint helpers */
function toast(msg, ms=1700){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=> toastEl.style.display='none', ms);
}
function showHint(on){ hintEl.style.display = on ? 'block' : 'none'; }

/* Three basics */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 3);

scene.add(new THREE.HemisphereLight(0xffffff,0x444466,0.9));
const dir = new THREE.DirectionalLight(0xffffff,1.1); dir.position.set(2,4,2); dir.castShadow=true; scene.add(dir);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.ShadowMaterial({opacity:0.28}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

/* Loaders (LOCAL) */
const draco = new DRACOLoader();
draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf = new GLTFLoader(); gltf.setDRACOLoader(draco);

/* Catalog */
const CATALOG_URL = './models/models.json';
let catalog = [];
let byCat = new Map();
const cache = new Map();
const placed = [];
let active = null;

async function loadCatalog(){
  try{
    const r = await fetch(CATALOG_URL, { cache:'no-store' });
    const data = await r.json();
    catalog = Array.isArray(data) ? data : (data.models||[]);
    byCat.clear();
    for (const it of catalog){
      const cat = (it.category||'General').trim();
      if (!byCat.has(cat)) byCat.set(cat, []);
      byCat.get(cat).push(it);
    }
    catSel.innerHTML = '';
    [...byCat.keys()].sort().forEach(c=>{
      const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o);
    });
    rebuildModelList();
    toast(`Catalog ready (${catalog.length})`);
  }catch(e){
    catSel.innerHTML='<option>Failed</option>'; modelSel.innerHTML='<option>—</option>';
    toast('Failed to load models.json');
  }
}
function rebuildModelList(){
  const list = byCat.get(catSel.value) || [];
  modelSel.innerHTML = '';
  list.forEach((m,i)=>{ const o=document.createElement('option'); o.value=String(i); o.textContent=m.name||m.url; modelSel.appendChild(o); });
}
catSel.addEventListener('change', rebuildModelList);
await loadCatalog();

/* Photo load (gallery & camera) */
function wirePicker(input){
  input.addEventListener('change', ()=>{
    const f = input.files?.[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    bgImg.src = url;
    bgImg.onload = ()=> URL.revokeObjectURL(url);
  });
}
wirePicker(pickGallery);
wirePicker(pickCamera);

btnGallery.onclick = ()=> pickGallery.click();
btnCamera.onclick  = ()=> pickCamera.click();

/* Model helpers */
async function ensureLoaded(item){
  if (cache.has(item.url)) return cache.get(item.url);
  const gl = await gltf.loadAsync(item.url);
  cache.set(item.url, gl.scene);
  return gl.scene;
}
function cloneFrom(item){
  const src = cache.get(item.url);
  const obj = src.clone(true);
  const s = item.scale ?? 1; obj.scale.setScalar(s);
  if (item.rotation) obj.rotation.set(...item.rotation);
  if (item.position) obj.position.set(...item.position);
  obj.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; }});
  return obj;
}

/* Placement gestures */
let touch = { mode:'idle', startScale:1, startRotY:0, startDist:0, startAng:0 };

function screenToGround(x,y){
  const ndc = new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc,camera);
  const hit = ray.intersectObject(ground,false)[0];
  return hit?.point || null;
}

renderer.domElement.addEventListener('touchstart', (e)=>{
  if (!active) return;
  if (e.touches.length===1){
    touch.mode='drag';
  }else if (e.touches.length===2){
    touch.mode='transform';
    const [t1,t2] = e.touches;
    touch.startDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    touch.startAng  = Math.atan2(t2.clientY-t1.clientY, t2.clientX-t1.clientX);
    touch.startScale= active.scale.x;
    touch.startRotY = active.rotation.y;
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove', (e)=>{
  if (!active) return;
  if (touch.mode==='drag' && e.touches.length===1){
    const pt = screenToGround(e.touches[0].clientX, e.touches[0].clientY);
    if (pt) active.position.lerp(pt, 0.28);
  } else if (touch.mode==='transform' && e.touches.length===2){
    const [p1,p2]=e.touches;
    const d  = Math.hypot(p2.clientX-p1.clientX, p2.clientY-p1.clientY);
    const ang= Math.atan2(p2.clientY-p1.clientY, p2.clientX-p1.clientX);
    // scale
    let s = touch.startScale * (d / touch.startDist);
    s = Math.min(Math.max(s, 0.05), 20);
    active.scale.setScalar(s);
    // rotate
    active.rotation.y = touch.startRotY + (ang - touch.startAng);
  }
},{passive:true});

renderer.domElement.addEventListener('touchend', ()=>{ touch.mode='idle'; },{passive:true});
renderer.domElement.addEventListener('click', ()=>{ if (placed.length){ active = placed[placed.length-1]; showHint(true); }});

/* Buttons */
btnAdd.onclick = async ()=>{
  const list = byCat.get(catSel.value) || [];
  const item = list[ Number(modelSel.value) ];
  if (!item){ toast('Choose a model'); return; }
  try{
    toast('Loading model…');
    await ensureLoaded(item);
    const o = cloneFrom(item);
    o.position.set(0,0,0);
    scene.add(o);
    placed.push(o);
    active = o;
    showHint(true);
    toast('Model added');
  }catch(e){ console.error(e); toast('Model load failed'); }
};

btnUndo.onclick = ()=>{ const o=placed.pop(); if(o){ scene.remove(o); if(o===active) active=null; toast('Undone'); } };
btnClear.onclick = ()=>{ while(placed.length){ scene.remove(placed.pop()); } active=null; toast('Cleared'); };

btnUi.onclick = ()=>{
  const off = panel.style.display==='none';
  panel.style.display = off ? 'flex' : 'none';
  btnUi.textContent = off ? '👁' : '👁';
};

btnSave.onclick = ()=>{
  // Compose background + GL overlay into one PNG
  const w = bgImg.naturalWidth || innerWidth, h = bgImg.naturalHeight || innerHeight;
  const out = document.createElement('canvas'); out.width=w; out.height=h;
  const ctx = out.getContext('2d');
  if (bgImg.src) ctx.drawImage(bgImg, 0, 0, w, h);
  const glURL = renderer.domElement.toDataURL('image/png');
  const im = new Image(); im.onload = ()=>{
    ctx.drawImage(im, 0, 0, w, h);
    const a=document.createElement('a'); a.href=out.toDataURL('image/png'); a.download=`staged-${Date.now()}.png`; a.click();
  }; im.src = glURL;
};

/* Render + resize */
function tick(){ renderer.render(scene,camera); requestAnimationFrame(tick); }
tick();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>
</body>
</html>
