<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>The New Innings Planner — Place On Image</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0b0f; color:#e6e6eb; font:15px system-ui,-apple-system,Segoe UI,Roboto; }

  /* Canvas fills screen; photo rendered as scene background */
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }

  /* Top HUD */
  #hud { position:fixed; inset:0 0 auto 0; z-index:10; padding:10px; display:flex; gap:8px; align-items:center;
         background:linear-gradient(180deg,rgba(8,10,14,.92),rgba(8,10,14,.65) 60%, rgba(8,10,14,0) 100%); }
  select, button { height:42px; border-radius:12px; border:1px solid #2a2e36; background:#14161b; color:#fff; padding:0 12px; }
  button.primary { background:#2563ff; border-color:#2563ff; }
  button.ghost   { background:#191b22; }
  button.icon    { width:42px; padding:0; display:grid; place-items:center; }
  button:disabled { opacity:.45; }
  #brand { display:flex; align-items:center; gap:8px; font-weight:600; }
  #brand img { width:28px; height:28px; border-radius:6px; object-fit:cover; }
  #spacer { flex:1; }

  /* Model toolbar */
  #toolbar { position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:10; display:none; gap:8px; }
  #toolbar > button { height:40px; border-radius:10px; }

  /* Bottom bar */
  #bottom { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:10; display:flex; gap:8px; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:138px; background:rgba(0,0,0,.55);
          padding:8px 12px; border-radius:10px; font-size:13px; display:none; z-index:10; }

  /* Show-UI pill when HUD hidden */
  #showUi { position:fixed; left:12px; top:12px; z-index:11; display:none; height:42px; border-radius:20px; padding:0 12px; }
  #showCtl { position:fixed; right:12px; top:12px; z-index:11; display:none; height:42px; border-radius:20px; padding:0 12px; }

  /* Toast */
  #toast { position:fixed; left:50%; transform:translateX(-50%); top:12px; padding:6px 10px; border-radius:10px;
           background:rgba(0,0,0,.55); font:12px ui-monospace,Menlo,Consolas,monospace; z-index:11; display:none; }

  /* Mobile */
  @media (max-width:480px){
    #brand span { display:none; }
  }
</style>

<!-- Import map -->
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="brand">
    <img src="./brand-logo.png" alt="Logo" onerror="this.style.display='none'"/>
    <span>The New Innings Planner</span>
  </div>

  <button id="btnPhoto" class="ghost">🖼️ Choose Photo</button>
  <button id="btnCamera" class="ghost">📷 Use Camera</button>
  <input id="filePhoto" type="file" accept="image/*" hidden>
  <!-- camera input uses capture to open camera on mobile -->
  <input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>

  <select id="catSel"><option>Loading…</option></select>
  <select id="modelSel" disabled><option>Select category</option></select>

  <button id="btnAdd" class="primary">+ Place</button>
  <button id="btnUndo" class="ghost">↺ Undo</button>
  <button id="btnClear" class="ghost">🗑 Clear</button>

  <div id="spacer"></div>

  <button id="btnHideCtl" class="ghost">🎛️ Hide Controls</button>
  <button id="btnHide" class="icon ghost" title="Hide UI">👁️</button>
</div>

<!-- Show buttons -->
<button id="showUi"  class="ghost">👁️ Show UI</button>
<button id="showCtl" class="ghost">🎛️ Show Controls</button>

<!-- Toolbar for editing -->
<div id="toolbar">
  <button id="rotL" class="ghost">◀ Rotate</button>
  <button id="rotR" class="ghost">Rotate ▶</button>
  <button id="sMinus" class="ghost">Scale −</button>
  <button id="sPlus"  class="ghost">Scale +</button>
  <button id="btnDone" class="primary">✅ Done</button>
</div>

<div id="hint">Tap on the photo to place the model</div>

<!-- Bottom actions -->
<div id="bottom">
  <button id="btnExport" class="ghost">⬇️ Download PNG</button>
</div>

<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $=id=>document.getElementById(id);

// UI refs
const hud=$('hud'), showUi=$('showUi');
const btnPhoto=$('btnPhoto'), btnCamera=$('btnCamera'), filePhoto=$('filePhoto'), fileCamera=$('fileCamera');
const catSel=$('catSel'), modelSel=$('modelSel');
const btnAdd=$('btnAdd'), btnUndo=$('btnUndo'), btnClear=$('btnClear');
const btnHide=$('btnHide'), btnHideCtl=$('btnHideCtl'), showCtl=$('showCtl');
const toolbar=$('toolbar'), rotL=$('rotL'), rotR=$('rotR'), sMinus=$('sMinus'), sPlus=$('sPlus'), btnDone=$('btnDone');
const hint=$('hint'), btnExport=$('btnExport');
const toast=$('toast');

const log=(m,ms=1600)=>{ toast.textContent=m; toast.style.display='block'; clearTimeout(log._t); log._t=setTimeout(()=>toast.style.display='none',ms); };

// Three setup
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// We'll use a Perspective camera but place a big "ground" plane at z=0 for raycasting.
// Scene background will be set to the uploaded image (texture), letterboxed automatically.
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.6, 3);

// Lighting + soft ground shadow
const hemi = new THREE.HemisphereLight(0xffffff,0x444466,0.9); scene.add(hemi);
const dir  = new THREE.DirectionalLight(0xffffff,1.0); dir.position.set(2,5,2); dir.castShadow=true; scene.add(dir);

// Invisible ground plane used for placement (at y=0)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshBasicMaterial({ visible:false }));
ground.rotation.x = -Math.PI/2; // make it horizontal
ground.position.y = 0;
scene.add(ground);

// Optional shadow receiver (subtle)
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.ShadowMaterial({ opacity:0.35 }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0; shadow.receiveShadow = true;
scene.add(shadow);

// Loaders
const draco = new DRACOLoader(); draco.setDecoderPath('./lib/three/examples/jsm/libs/draco/');
const gltf  = new GLTFLoader();  gltf.setDRACOLoader(draco);

// Catalog
const CATALOG_URL = './models/models.json?v=' + Date.now();
let catalog = { categories:{} };
let catOrder = [];

// States
const cache = new Map();      // url -> THREE.Object3D
const placed = [];            // placed objects
let selected=null, editing=false;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

// Background
let bgTexture = null;

// Helpers
function enableShadows(obj,on){ obj.traverse(n=>{ if(n.isMesh){ n.castShadow=on; n.receiveShadow=on; } }); }
async function preload(cat, idx){
  const it = catalog.categories[cat]?.[idx]; if(!it) throw new Error('Invalid item');
  if (cache.has(it.url)) return cache.get(it.url);
  const gl = await gltf.loadAsync(it.url);
  cache.set(it.url, gl.scene);
  return gl.scene;
}
function cloneFrom(cat,idx){
  const it = catalog.categories[cat][idx];
  const src = cache.get(it.url);
  const obj = src.clone(true);
  const s = it.scale ?? 1; obj.scale.setScalar(s);
  if (it.rotation) obj.rotation.set(...it.rotation);
  if (it.position) obj.position.set(...it.position);
  enableShadows(obj, it.shadow !== false);
  return obj;
}
function setEdit(on){
  editing = on;
  toolbar.style.display = on ? 'flex' : 'none';
  hint.style.display = (!on) ? 'block' : 'none';
}
function toggleHUD(hide){
  hud.style.display = hide ? 'none' : 'flex';
  showUi.style.display = hide ? 'inline-block' : 'none';
}
function toggleControls(hide){
  toolbar.style.display = hide ? 'none' : (editing ? 'flex' : 'none');
  showCtl.style.display = hide ? 'inline-block' : 'none';
}

// Photo loading
function setBackgroundFromFile(file){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = ()=>{
      const tex = new THREE.Texture(img);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      bgTexture = tex;
      scene.background = tex;
      // keep perspective; nothing special needed—Three letterboxes the background
      log('Photo loaded');
      hint.style.display='block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Map screen coords to ground plane
function setPointerFromEvent(e){
  const x = (e.clientX ?? e.touches?.[0]?.clientX ?? 0);
  const y = (e.clientY ?? e.touches?.[0]?.clientY ?? 0);
  pointer.x =  (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
}
function intersectGround(){
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground, false);
  return hits[0] || null;
}

// ---------- Catalog ----------
(async()=>{
  try{
    const r = await fetch(CATALOG_URL, { cache:'no-store' });
    let txt = await r.text();
    if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
    const data = JSON.parse(txt);
    catalog = Array.isArray(data) ? { categories:{ Default:data } } : data;
    catOrder = Object.keys(catalog.categories);

    catSel.innerHTML = '';
    for (const c of catOrder){
      const opt = document.createElement('option'); opt.value=c; opt.textContent=c; catSel.appendChild(opt);
    }
    updateModelOptions();
    log(`Catalog loaded (${catOrder.length} categories)`);
  }catch(e){
    catSel.innerHTML = '<option>Failed to load</option>';
    modelSel.innerHTML = '<option>—</option>';
    log('Failed to load catalog');
  }
})();
function updateModelOptions(){
  const cat = catSel.value;
  const arr = catalog.categories[cat] || [];
  modelSel.innerHTML = '';
  arr.forEach((it,i)=>{
    const opt=document.createElement('option'); opt.value=String(i); opt.textContent=it.name||`Model ${i+1}`; modelSel.appendChild(opt);
  });
  modelSel.disabled = arr.length===0;
}
catSel.onchange = updateModelOptions;

// ---------- UI events ----------
btnPhoto.onclick = ()=> filePhoto.click();
btnCamera.onclick= ()=> fileCamera.click();
filePhoto.onchange = e=>{ const f=e.target.files?.[0]; if(f) setBackgroundFromFile(f); };
fileCamera.onchange= e=>{ const f=e.target.files?.[0]; if(f) setBackgroundFromFile(f); };

btnAdd.onclick = async ()=>{
  const cat = catSel.value;
  const idx = Number(modelSel.value);
  if (!bgTexture){ log('Choose a photo first'); return; }
  if (Number.isNaN(idx)){ log('Select a model'); return; }

  try{
    await preload(cat, idx);
    // wait for a tap to place — next click/touch places it
    placing = { cat, idx };
    hint.textContent = 'Tap on the photo to place';
    hint.style.display = 'block';
    log('Tap to place');
  }catch{ log('Preload failed'); }
};

btnUndo.onclick = ()=>{
  const o = placed.pop();
  if (o){ scene.remove(o); if (o===selected){ selected=null; setEdit(false); } }
  log('Undo');
};

btnClear.onclick = ()=>{
  while(placed.length){ const o=placed.pop(); scene.remove(o); }
  selected=null; setEdit(false); log('Cleared');
};

btnHide.onclick = ()=> toggleHUD(true);
showUi.onclick  = ()=> toggleHUD(false);

btnHideCtl.onclick = ()=> toggleControls(true);
showCtl.onclick    = ()=> toggleControls(false);

// Toolbar
rotL.onclick = ()=>{ if(selected) selected.rotation.y -= Math.PI/18; };
rotR.onclick = ()=>{ if(selected) selected.rotation.y += Math.PI/18; };
sMinus.onclick= ()=>{ if(selected){ const s=Math.max(0.05, selected.scale.x*0.9); selected.scale.setScalar(s);} };
sPlus.onclick = ()=>{ if(selected){ const s=Math.min(10, selected.scale.x*1.1); selected.scale.setScalar(s);} };
btnDone.onclick = ()=>{ setEdit(false); selected=null; };

// Export composite
btnExport.onclick = ()=>{
  if (!bgTexture){ log('No photo to export'); return; }
  const url = renderer.domElement.toDataURL('image/png');
  const a=document.createElement('a'); a.href=url; a.download=`compose-${Date.now()}.png`; a.click();
};

// ---------- Placement & Gestures ----------
let placing=null;       // {cat,idx} when user clicked +Place
let dragging=false;     // move selected with one-finger drag
let pinch=null;         // {startDist, startAng, baseScale, baseRotY}

renderer.domElement.addEventListener('pointerdown', (e)=>{
  if (!bgTexture) return; // need a photo
  setPointerFromEvent(e);

  // If we’re currently arming a placement
  if (placing){
    const hit = intersectGround();
    if (hit){
      const obj = cloneFrom(placing.cat, placing.idx);
      obj.position.copy(hit.point);
      obj.position.y = 0; // on ground
      scene.add(obj);
      placed.push(obj);
      selected = obj; setEdit(true);
      hint.style.display='none';
      placing=null;
      log('Placed');
    }
    return;
  }

  // If touching an existing object? (simple heuristic: last placed)
  if (placed.length){
    selected = placed[placed.length-1];
    setEdit(true);
  }

  dragging = true;
});
renderer.domElement.addEventListener('pointermove', (e)=>{
  if (!dragging || !selected) return;
  setPointerFromEvent(e);
  const hit = intersectGround();
  if (hit){
    // Smoothly move on plane
    selected.position.lerp(new THREE.Vector3(hit.point.x, 0, hit.point.z), 0.35);
  }
});
renderer.domElement.addEventListener('pointerup', ()=>{ dragging=false; });

// Touch pinch/twist for scale/rotate
function toPt(t){ return ({x:t.clientX, y:t.clientY}); }
function d2(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
function ang(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }

renderer.domElement.addEventListener('touchstart', (e)=>{
  if (!selected) return;
  if (e.touches.length===2){
    const p1=toPt(e.touches[0]), p2=toPt(e.touches[1]);
    pinch = { startDist:d2(p1,p2), startAng:ang(p1,p2), baseScale:selected.scale.x, baseRotY:selected.rotation.y };
  }
},{passive:true});

renderer.domElement.addEventListener('touchmove', (e)=>{
  if (!selected || !pinch || e.touches.length!==2) return;
  const p1=toPt(e.touches[0]), p2=toPt(e.touches[1]);
  // scale
  let s = pinch.baseScale * (d2(p1,p2)/pinch.startDist);
  s = Math.min(Math.max(s,0.05), 10);
  selected.scale.setScalar(s);
  // rotate
  const delta = ang(p1,p2) - pinch.startAng;
  selected.rotation.y = pinch.baseRotY + delta;
},{passive:true});

renderer.domElement.addEventListener('touchend', ()=>{ pinch=null; }, {passive:true});

// ---------- Render loop & resize ----------
function render(){ renderer.render(scene, camera); requestAnimationFrame(render); }
render();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>
</body>
</html>
